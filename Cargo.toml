[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Fahad Baloch"]
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
danish-core = { path = "crates/core" }
argon2 = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
csv = "1.4.0"
log = "0.4.34"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
ts-rs = "12.0.1"
uuid = { version = "1.26.1", features = ["v7"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Faster test/dev builds of the heavy C dependency (SQLite) and crypto.
[profile.dev.package.libsqlite3-sys]
opt-level = 2

[profile.dev.package.argon2]
opt-level = 3
